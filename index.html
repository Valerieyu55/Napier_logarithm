<title>納皮爾的對數表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;700;900&family=Special+Elite&display=swap">
<style>
/* Layout: a night-time adventure game. Painted scene behind, game HUD on top, visual-novel dialogue box at the bottom, parchment puzzle cards and a brass-cornered workbench in the play area. Deliberately single-theme (night). */
:root{
  color-scheme:dark;
  --ink:#07090e; --night:#0e1220; --panel:#151a27; --panel2:#1d2434; --line:#2c3446;
  --fg:#f2ebdc; --fg2:#b6b1a3; --fg3:#7f7b72;
  --brass:#e0b45a; --brass-hi:#ffd98a; --brass-dim:#7a6230; --on-brass:#1a1308;
  --paper:#ecdfbf; --paper2:#e2d2a9; --paper-ink:#2b2014; --paper-mut:#6e5b3d; --paper-line:#c4ad7d;
  --flame:#ffb547; --ok:#5fd1b3; --bad:#ff7563; --xp:#8fb4ff; --ink-red:#b23a2c;
  --f-fell:"IM Fell English","Noto Serif TC",Georgia,serif;
  --f-sc:"IM Fell English SC","IM Fell English",Georgia,serif;
  --f-title:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Noto Serif TC",serif;
  --f-ui:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
sup,sub{font-size:.66em;line-height:0}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}

/* ---------- buttons ---------- */
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:6px;border:2px solid var(--brass);background:linear-gradient(#f0c873,#c8973f);color:var(--on-brass);font-family:var(--f-title);font-weight:900;font-size:16px;letter-spacing:.08em;cursor:pointer;box-shadow:0 4px 0 #7a5a1e,0 8px 18px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.gbtn:hover{filter:brightness(1.08)}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5a1e,0 4px 10px rgba(0,0,0,.3)}
.gbtn.ghost{background:rgba(14,18,32,.7);color:var(--fg);border-color:var(--brass-dim);box-shadow:0 4px 0 #050608}
.gbtn.ghost:hover{border-color:var(--brass)}
.gbtn.sm{padding:7px 14px;font-size:14px;box-shadow:0 3px 0 #7a5a1e}
.gbtn.ghost.sm{box-shadow:0 3px 0 #050608}
.gbtn:disabled{opacity:.45;cursor:default;transform:none;filter:none}
.gbtn kbd{font-family:var(--f-mono);font-size:11px;font-weight:600;border:1px solid currentColor;border-radius:3px;padding:0 5px;opacity:.6;letter-spacing:0}
.hb{display:inline-flex;align-items:center;gap:6px;background:rgba(14,18,32,.75);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--fg);cursor:pointer;white-space:nowrap}
.hb:hover{border-color:var(--brass)}
.hb[aria-pressed="true"]{border-color:var(--brass);color:var(--brass-hi)}
.lnk{background:none;border:0;padding:0;color:var(--fg2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13px}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:12px var(--gr) 12px var(--gl);background:linear-gradient(to bottom,rgba(7,9,14,.92),rgba(7,9,14,.55) 70%,rgba(7,9,14,0))}
.hud-r{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(14,18,32,.85);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-family:var(--f-mono);font-weight:600;font-size:14px}
.pill.coin{padding:4px 12px 4px 8px;color:var(--brass-hi)}
.lvb{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a9c4ff,#4f6fb8);color:#0b1020;font-size:13px;font-weight:700;padding:0 4px}
.xpbar{display:block;width:72px;height:7px;background:#232a3b;border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#6f97f2,#b6cdff);transition:width .5s}
.hud-ch{display:flex;align-items:baseline;gap:10px;min-width:0}
.hud-ch .rn{font-family:var(--f-sc);font-size:22px;color:var(--brass);line-height:1}
.hud-ch b{font-family:var(--f-title);font-weight:900;font-size:16px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.candles{display:flex;gap:4px;align-items:flex-end;height:34px}
.candle{width:16px;height:30px;position:relative}
.candle svg{width:100%;height:100%;overflow:visible}
.candle .fl{transform-origin:12px 15px;animation:flick 1.6s ease-in-out infinite}
.candle.out .fl{opacity:0}
.candle.out .smoke{animation:smoke 1.2s ease-out forwards}
.candle .smoke{opacity:0}
@keyframes flick{0%,100%{transform:scale(1,1)}30%{transform:scale(.92,1.08)}60%{transform:scale(1.06,.95)}}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-16px)}}
.prog{width:120px;height:6px;background:#232a3b;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brass);transition:width .4s}
.benchbtn{display:none}
.benchbtn.ping{animation:ping 1s ease 3}
@keyframes ping{50%{box-shadow:0 0 0 6px rgba(224,180,90,.35);border-color:var(--brass)}}

/* ---------- title ---------- */
.title{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
.scene{position:absolute;inset:0;z-index:0;overflow:hidden}
.scene svg{width:100%;height:100%;display:block}
.scene .flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.8s ease-in-out infinite}
.scene .glowp{animation:glowp 3s ease-in-out infinite}
@keyframes glowp{50%{opacity:.75}}
.title::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,14,.92) 0%,rgba(7,9,14,.7) 45%,rgba(7,9,14,.15) 100%);z-index:1}
.tt{position:relative;z-index:2;padding:64px var(--gr) 64px var(--gl);width:100%;max-width:1240px;margin:0 auto}
.tt-digits{position:absolute;right:0;top:0;bottom:0;width:46%;z-index:1;font-family:var(--f-mono);font-size:13px;line-height:2.1;color:var(--brass);opacity:.12;white-space:pre;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 50%);mask-image:linear-gradient(90deg,transparent,#000 50%)}
.tt-digits span{display:block;animation:drift 200s linear infinite}
@keyframes drift{to{transform:translateY(-50%)}}
.tt-latin{font-family:var(--f-fell);font-style:italic;font-size:clamp(15px,2vw,21px);color:var(--brass)}
.logo{font-family:var(--f-title);font-weight:900;font-size:clamp(56px,11vw,136px);line-height:1.02;letter-spacing:.04em;margin:14px 0 12px;background:linear-gradient(180deg,#fff3d2 0%,#f0c873 55%,#a8782a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 0 30px rgba(255,181,71,.25))}
.tt-sc{font-family:var(--f-sc);font-size:18px;letter-spacing:.3em;color:var(--fg2)}
.tt-lead{font-family:var(--f-title);font-size:clamp(15px,1.6vw,18px);line-height:1.9;color:var(--fg2);max-width:28em;margin-top:22px}
.tt-menu{display:flex;gap:14px;flex-wrap:wrap;margin-top:38px;align-items:center}
.press{margin-top:26px;font-family:var(--f-title);letter-spacing:.3em;color:var(--brass-hi);font-size:15px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tt-foot{margin-top:40px;display:flex;gap:18px;flex-wrap:wrap;color:var(--fg3);font-size:13px}

/* ---------- hub / map ---------- */
.screen{min-height:100vh;background:radial-gradient(ellipse at 30% 0%,#1a2236 0%,var(--ink) 65%)}
.hubgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:4px var(--gr) 48px var(--gl);max-width:1400px;margin:0 auto;align-items:start}
@media (max-width:980px){.hubgrid{grid-template-columns:minmax(0,1fr)}}
.mapbox{position:relative;border:2px solid var(--brass-dim);border-radius:10px;overflow:hidden;background:#0c1626;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .node{cursor:pointer}
.mapbox .node:focus{outline:none}
.mapbox .node:focus-visible circle.ring{stroke:var(--brass-hi);stroke-width:4}
.mapbox .node.locked{cursor:not-allowed}
.mapbox .pawn{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.mapbox .cur circle.halo{animation:halo 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.mapcap{position:absolute;left:14px;top:12px;font-family:var(--f-sc);color:var(--brass);letter-spacing:.2em;font-size:14px;opacity:.85}
.side{display:flex;flex-direction:column;gap:16px}
.card{background:linear-gradient(180deg,#1a2030,#131826);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.card.brass{border-color:var(--brass-dim)}
.card h2{font-family:var(--f-title);font-weight:900;font-size:19px}
.card p{color:var(--fg2);font-size:14px;line-height:1.75}
.player{display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center}
.avatar{width:72px;height:72px;border-radius:50%;background:#26304a;border:2px solid var(--brass);overflow:hidden}
.avatar svg{width:100%;height:100%;display:block}
.pname{font-family:var(--f-title);font-weight:900;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rank{font-size:12px;color:var(--brass-hi);letter-spacing:.12em}
.bigxp{height:10px;background:#232a3b;border-radius:6px;overflow:hidden;margin-top:6px}
.bigxp i{display:block;height:100%;background:linear-gradient(90deg,#6f97f2,#b6cdff);transition:width .6s}
.pstats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:13px;color:var(--fg2);margin-top:4px}
.pstats b{color:var(--fg);font-weight:600}
.pv-top{display:flex;align-items:baseline;gap:12px}
.pv-rn{font-family:var(--f-sc);font-size:44px;line-height:.9;color:var(--brass)}
.pv-when{font-family:var(--f-fell);color:var(--fg2);font-size:15px}
.pv h3{font-family:var(--f-title);font-weight:900;font-size:22px}
.pv .hook{font-family:var(--f-hand);font-size:17px;color:var(--fg2)}
.stars{display:inline-flex;gap:3px;color:#3b4256;font-size:20px;line-height:1}
.stars .on{color:var(--brass-hi);text-shadow:0 0 8px rgba(255,217,138,.6)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--fg2);background:rgba(255,255,255,.02)}
.pv-nav{display:flex;justify-content:space-between;gap:8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(180deg,#1e2537,#151a28);cursor:pointer;transition:transform .12s,border-color .12s}
.mode:hover{transform:translateY(-2px);border-color:var(--brass)}
.mode b{font-family:var(--f-title);font-weight:900;font-size:16px}
.mode span{font-size:12.5px;color:var(--fg2);line-height:1.55}
.mode .mi{font-family:var(--f-sc);color:var(--brass);font-size:13px;letter-spacing:.14em}

/* ---------- stage (story) ---------- */
.stage{position:relative;min-height:100vh;display:flex;flex-direction:column;overflow:hidden;background:var(--ink)}
.stage>.scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(7,9,14,0) 30%,rgba(7,9,14,.55) 100%)}
.stage .hud{position:relative;top:auto}
.arena{position:relative;z-index:2;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:28px;padding:6px var(--gr) 14px var(--gl);align-items:stretch}
.arena.nobench{grid-template-columns:minmax(0,1fr)}
.arena.nobench .bench{display:none}
.left{display:flex;flex-direction:column;justify-content:flex-end;min-width:0;gap:16px}
.left.q{justify-content:flex-start}
.arena.nobench .left.q{align-items:center}
.sprite{width:clamp(190px,21vw,290px);margin-left:clamp(0px,3vw,48px);filter:drop-shadow(0 12px 24px rgba(0,0,0,.6));transition:opacity .25s,transform .25s}
.sprite svg{display:block;width:100%;height:auto}
.sprite.in{animation:spIn .35s ease both}
@keyframes spIn{from{opacity:0;transform:translateX(-24px)}}
.sprite.idle svg{animation:breathe 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes breathe{50%{transform:scaleY(1.012)}}
.boxslot{position:relative;z-index:4;padding:0 var(--gr) calc(18px + env(safe-area-inset-bottom,0px)) var(--gl)}
.dbox{max-width:1120px;margin:0 auto;background:linear-gradient(180deg,rgba(22,27,42,.96),rgba(12,15,25,.97));border:2px solid var(--brass-dim);border-radius:12px;padding:24px 28px 30px;position:relative;min-height:150px;cursor:pointer;box-shadow:0 14px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(224,180,90,.12);display:flex;gap:16px;align-items:flex-start}
.dbox:hover{border-color:var(--brass)}
.dbox.hide{display:none}
.dface{display:none;width:64px;height:64px;flex:none;border-radius:8px;border:1px solid var(--brass-dim);background:#26304a;overflow:hidden}
.dface svg{width:100%;height:auto;display:block;margin-top:-4px}
.nameplate{position:absolute;top:-17px;left:24px;background:linear-gradient(#f0c873,#c8973f);color:var(--on-brass);font-family:var(--f-title);font-weight:900;padding:3px 18px;border-radius:5px;letter-spacing:.12em;font-size:15px;box-shadow:0 3px 0 #7a5a1e}
.nameplate.k{background:linear-gradient(#bcd0ff,#7d9de6);box-shadow:0 3px 0 #3e5590}
.nameplate.b{background:linear-gradient(#9ee6d2,#4fae96);box-shadow:0 3px 0 #2a6b5a}
.nameplate.y{background:linear-gradient(#e8e1d2,#b5ab97);box-shadow:0 3px 0 #6d6553}
.dtext{font-family:var(--f-hand);font-size:clamp(17px,1.75vw,21px);line-height:1.85;flex:1;min-width:0}
.dbox.nar .dtext{font-family:var(--f-title);color:#d8d0bf;font-size:clamp(15.5px,1.5vw,18px)}
.dbox.nar{border-style:dashed}
.dmore{position:absolute;right:20px;bottom:10px;color:var(--brass);font-size:14px;animation:bounce .9s ease-in-out infinite;display:flex;gap:8px;align-items:center}
.dmore small{font-size:11px;color:var(--fg3);letter-spacing:.1em}
@keyframes bounce{50%{transform:translateY(4px)}}

/* ---------- puzzle card ---------- */
.pz{position:relative;width:100%;max-width:720px;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);border-radius:10px;padding:22px 24px 22px;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.4),inset 0 0 60px rgba(150,110,50,.18);display:flex;flex-direction:column;gap:14px;border:1px solid #b89c62}
.pz.enter{animation:pzIn .4s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pzIn{from{opacity:0;transform:translateY(24px) scale(.96) rotate(-1deg)}}
.pz-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--paper-line);padding-bottom:10px}
.pz-no{font-family:var(--f-sc);font-size:19px;letter-spacing:.06em;color:var(--ink-red)}
.pz-tag{font-size:12px;letter-spacing:.1em;color:var(--paper-mut);font-weight:700}
.pz-rw{margin-left:auto;display:flex;gap:6px;font-family:var(--f-mono);font-size:12.5px;font-weight:600}
.pz-rw span{background:rgba(43,32,20,.08);border:1px solid var(--paper-line);border-radius:999px;padding:1px 9px;display:inline-flex;align-items:center;gap:4px}
.pz-p{font-family:var(--f-title);font-size:clamp(17px,1.7vw,20px);line-height:1.85;font-weight:700}
.pz-in{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pz-in input{font-family:var(--f-mono);font-size:20px;font-weight:600;width:11ch;max-width:100%;padding:9px 12px;border:2px solid #a88c55;border-radius:6px;background:#fbf4e1;color:var(--paper-ink)}
.pz-in input:focus{outline:none;border-color:var(--ink-red);box-shadow:0 0 0 3px rgba(178,58,44,.18)}
.pz-in input:disabled{opacity:.7}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:540px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:12px;align-items:baseline;text-align:left;padding:12px 14px;border:2px solid #b89c62;border-radius:8px;background:#f8efd6;cursor:pointer;font-family:var(--f-title);font-size:16.5px;line-height:1.6;color:var(--paper-ink);min-width:0;box-shadow:0 3px 0 #b89c62;transition:transform .08s}
.opt .ol{font-family:var(--f-sc);color:var(--ink-red);font-size:18px;flex:none}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--ink-red)}
.opt:disabled{cursor:default}
.opt.yes{border-color:#2f8f74;background:#d9f0e3;box-shadow:0 3px 0 #2f8f74}
.opt.no{border-color:var(--ink-red);background:#f4d7cd;opacity:.7;box-shadow:none}
.opt.no span:last-child{text-decoration:line-through}
.pz-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pz-tools:empty{display:none}
.ptool{background:none;border:1px dashed #a88c55;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--paper-mut);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ptool:hover{border-style:solid;color:var(--paper-ink)}
.ptool.tobench{display:none}
.pz-fb{display:flex;flex-direction:column;gap:6px;font-size:15.5px;line-height:1.75}
.pz-fb:empty{display:none}
.pz-fb .ok{color:#1f7a60;font-weight:700}
.pz-fb .bad{color:var(--ink-red);font-weight:700}
.pz-fb .hint{color:var(--paper-mut);font-family:var(--f-hand);font-size:16.5px}
.pz-fb .ex{color:var(--paper-ink);font-family:var(--f-title);border-top:1px dashed #a88c55;padding-top:8px}
.pz-next{display:flex;gap:10px;flex-wrap:wrap}
.pz-next:empty{display:none}
.stamp{position:absolute;right:22px;top:58px;width:118px;height:118px;border-radius:50%;border:5px double var(--ink-red);color:var(--ink-red);display:grid;place-items:center;font-family:var(--f-title);font-weight:900;font-size:30px;letter-spacing:.1em;transform:rotate(-14deg);opacity:0;pointer-events:none;mix-blend-mode:multiply}
.stamp.ok{border-color:#1f7a60;color:#1f7a60}
.stamp.show{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(2.2)}100%{opacity:.88;transform:rotate(-14deg) scale(1)}}
.shake{animation:shake .42s ease}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

/* ---------- bench ---------- */
.bench{position:relative;align-self:start;background:linear-gradient(180deg,rgba(26,32,48,.97),rgba(16,20,32,.97));border:1px solid #3d4558;padding:18px;border-radius:4px;min-width:0;box-shadow:0 18px 40px rgba(0,0,0,.5)}
.bench::before,.bench::after{content:"";position:absolute;width:18px;height:18px;border-color:var(--brass);border-style:solid;pointer-events:none}
.bench::before{top:-2px;left:-2px;border-width:3px 0 0 3px}
.bench::after{bottom:-2px;right:-2px;border-width:0 3px 3px 0}
.bench.glow{animation:benchGlow 1.4s ease 2}
@keyframes benchGlow{50%{box-shadow:0 0 0 4px rgba(224,180,90,.45),0 18px 40px rgba(0,0,0,.5)}}
.wb-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.wb-k{font-family:var(--f-sc);font-size:13px;letter-spacing:.2em;color:var(--brass)}
.wb-t{font-family:var(--f-title);font-weight:900;font-size:17px}
.wb-x{display:none}
.wb-read{margin-top:12px;font-family:var(--f-title);font-size:15px;color:var(--fg2);min-height:1.9em}
.p2grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.p2{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg);width:100%}
.p2 .n{color:var(--fg3)}
.p2:hover{background:rgba(224,180,90,.1)}
.p2.on{background:rgba(224,180,90,.2)} .p2.on .v,.p2.on .n{color:var(--brass-hi)}
.cv svg{width:100%;height:auto;display:block}
.gl{stroke:#2a3244;stroke-width:1}
.ax{stroke:#4a5368;stroke-width:1.4}
.crv{fill:none;stroke:var(--brass);stroke-width:3}
.pt{fill:var(--brass-hi);stroke:#141926;stroke-width:3}
.gd{stroke:var(--fg3);stroke-dasharray:3 4;stroke-width:1}
.tk{fill:var(--fg3);font-family:var(--f-mono);font-size:11px}
.rf{stroke:var(--ok);stroke-dasharray:6 5;opacity:.7}
.rft{fill:var(--ok);font-family:var(--f-mono);font-size:11px}
.cv-read{display:flex;gap:6px 20px;align-items:baseline;flex-wrap:wrap;font-family:var(--f-mono);font-size:21px;margin:12px 0 8px;font-variant-numeric:tabular-nums}
.cv-read b{color:var(--brass-hi);font-weight:600}
.cv input[type=range]{width:100%;accent-color:var(--brass)}
.cv-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cv-btns .hb{font-family:var(--f-mono)}
.cv-x{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--fg2);flex-wrap:wrap}
.tin{font-family:var(--f-mono);font-size:15px;width:10ch;padding:6px 10px;border:1px solid #3d4558;border-radius:4px;background:#0c0f18;color:var(--fg)}
.tin:focus{border-color:var(--brass);outline:none}
.lt-tools{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.lt-tools label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg2);letter-spacing:.06em}
.lt-read{font-family:var(--f-mono);font-size:17px;min-height:1.8em;margin-bottom:10px;line-height:1.6}
.lt-read .m{color:var(--fg2);font-family:var(--f-ui);font-size:13px;display:block}
.lt-wrap{max-height:min(52vh,500px);overflow:auto;border:1px solid var(--line);background:#0b0e16}
.lt{border-collapse:collapse;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;width:100%}
.lt thead th{position:sticky;top:0;background:#1a2030;color:var(--fg2);font-weight:500;padding:5px 6px;border-bottom:1px solid #3d4558;z-index:2}
.lt thead th:first-child{left:0;z-index:3}
.lt tbody th{position:sticky;left:0;background:#1a2030;color:var(--brass);font-weight:600;padding:3px 8px;border-right:1px solid #3d4558;z-index:1}
.lt td{padding:3px 6px;text-align:center;cursor:pointer;color:var(--fg)}
.lt td:hover{background:rgba(224,180,90,.12)}
.lt tr.b5 td,.lt tr.b5 th{border-bottom:1px solid var(--line)}
.lt .c5{border-left:1px solid var(--line)}
.lt tr.rh td{background:rgba(224,180,90,.12)}
.lt td.hit{background:var(--brass);color:var(--on-brass);font-weight:600}
.fc .f{font-family:var(--f-title);font-size:21px;line-height:1.8;margin:6px 0 10px}
.fc .g{color:var(--fg2);font-size:14px;line-height:1.8;font-family:var(--f-title)}
.wb-empty{color:var(--fg3);font-family:var(--f-hand);font-size:16px;padding:30px 8px;text-align:center;line-height:1.8}

/* ---------- board ---------- */
.shead{display:flex;align-items:flex-end;gap:16px 28px;flex-wrap:wrap;padding:8px var(--gr) 22px var(--gl);max-width:1400px;margin:0 auto}
.shead h1{font-family:var(--f-title);font-weight:900;font-size:clamp(28px,4vw,42px)}
.shead .sub{color:var(--fg2);font-size:14.5px;max-width:34em;line-height:1.8;margin-top:6px}
.sstats{display:flex;gap:26px;flex-wrap:wrap;margin-left:auto}
.sstats div{display:flex;flex-direction:column;align-items:flex-start}
.sstats b{font-family:var(--f-sc);font-size:30px;font-weight:400;color:var(--brass-hi);line-height:1}
.sstats span{font-size:12px;color:var(--fg2);letter-spacing:.1em;margin-top:6px}
.body{padding:0 var(--gr) 56px var(--gl);max-width:1400px;margin:0 auto}
.board{background:repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 38px),linear-gradient(180deg,#4a3320,#33220f);border:10px solid #5a3e24;border-radius:10px;box-shadow:inset 0 0 40px rgba(0,0,0,.55),0 20px 50px rgba(0,0,0,.5);padding:34px 28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
@media (max-width:860px){.board{grid-template-columns:minmax(0,1fr);padding:26px 16px}}
.notice{position:relative;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);padding:26px 20px 18px;border-radius:3px;transform:rotate(var(--r,0deg));box-shadow:0 10px 20px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.notice:hover{transform:rotate(0deg) translateY(-4px)}
.notice::before{content:"";position:absolute;top:8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9f8a,#a32b1e);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.notice .cl{font-family:var(--f-title);font-weight:900;font-size:17px}
.notice .fl{font-family:var(--f-hand);font-size:15.5px;color:var(--paper-mut);line-height:1.7}
.notice .sk{font-size:12.5px;font-weight:700;color:var(--ink-red);letter-spacing:.06em}
.notice .rw{display:flex;gap:10px;align-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;flex-wrap:wrap}
.notice .diff{color:#a8782a;letter-spacing:2px}
.notice .gbtn{margin-top:auto;align-self:flex-start}
.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:28px;align-items:start}
.work.nobench{grid-template-columns:minmax(0,760px)}
@media (max-width:860px){.work{grid-template-columns:minmax(0,1fr)}}
.client{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:14px;color:var(--fg2);font-family:var(--f-hand);font-size:17px}
.client b{font-family:var(--f-title);color:var(--fg);font-size:16px}

/* ---------- rush ---------- */
.rushbar{position:relative;height:16px;border-radius:10px;background:#1c2232;overflow:hidden;border:1px solid var(--line);margin-bottom:18px}
.rushbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff7563,#ffb547 40%,#5fd1b3);transition:width .1s linear}
.rushhud{display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.rushhud div{display:flex;flex-direction:column}
.rushhud b{font-family:var(--f-mono);font-weight:600;font-size:34px;line-height:1;color:var(--fg)}
.rushhud b.t{color:var(--brass-hi)}
.rushhud span{font-size:12px;color:var(--fg2);letter-spacing:.1em;margin-top:4px}
.combo{font-family:var(--f-sc);font-size:28px;color:var(--flame);text-shadow:0 0 14px rgba(255,181,71,.6)}
.combo.pop{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.35)}}

/* ---------- collection ---------- */
.tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap}
.tab{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 18px;color:var(--fg2);cursor:pointer;font-size:14px}
.tab[aria-selected="true"]{background:var(--brass);color:var(--on-brass);border-color:var(--brass);font-weight:700}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.scard{position:relative;border-radius:10px;padding:16px 16px 14px;background:linear-gradient(160deg,#20283a,#141926);border:2px solid #3a4256;display:flex;flex-direction:column;gap:8px;min-height:220px;overflow:hidden}
.scard.l1{border-color:#9a6b3f}
.scard.l2{border-color:#c9cfd9}
.scard.l3{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass-hi),0 0 22px rgba(255,217,138,.25)}
.scard.l3::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,240,200,.14) 45%,transparent 60%);animation:shine 3.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.scard .tier{font-family:var(--f-sc);font-size:12px;letter-spacing:.18em;color:var(--fg3)}
.scard.l1 .tier{color:#d49a62} .scard.l2 .tier{color:#dfe5ee} .scard.l3 .tier{color:var(--brass-hi)}
.scard h3{font-family:var(--f-title);font-weight:900;font-size:18px}
.scard .f{font-family:var(--f-title);font-size:15px;color:var(--fg2);line-height:1.7;flex:1}
.scard .gems{display:flex;gap:5px}
.scard .gems i{width:14px;height:14px;transform:rotate(45deg);background:#2b3244;border:1px solid #3a4256}
.scard .gems i.on{background:linear-gradient(135deg,#ffe3a1,#c8973f);border-color:#ffd98a}
.scard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--fg2)}
.scard.lock{opacity:.55}
.scard.lock h3{color:var(--fg3)}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 12px;border-radius:10px;border:1px solid var(--line);background:#141926}
.medal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#ffe9b0,#c8973f 60%,#7a5a1e);color:var(--on-brass);font-family:var(--f-sc);font-size:22px;box-shadow:0 4px 0 #5a4214,0 0 18px rgba(255,217,138,.3)}
.badge.lock .medal{background:#232a3b;color:#4a5368;box-shadow:none}
.badge b{font-family:var(--f-title);font-size:15px}
.badge span{font-size:12.5px;color:var(--fg2);line-height:1.5}
.notes{display:flex;flex-direction:column;gap:12px;max-width:760px}
.nitem{background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);border-radius:8px;padding:16px 20px}
.nitem .t{font-family:var(--f-sc);color:var(--ink-red);font-size:14px;letter-spacing:.1em}
.nitem h4{font-family:var(--f-title);font-size:16px;font-weight:900;margin-top:2px}
.nitem .b{font-family:var(--f-title);font-size:17px;line-height:1.95;margin-top:6px}
.ladder{border-collapse:collapse;font-family:var(--f-title)}
.ladder td{padding:2px 14px 2px 0}
.ladder td:nth-child(2){color:var(--ink-red)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--gl);background:rgba(4,6,10,.72);animation:fade .2s ease both;overflow:auto}
.ov.out{animation:fadeOut .2s ease both}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.ovc{position:relative;width:min(560px,100%);background:linear-gradient(180deg,#1d2436,#121624);border:2px solid var(--brass-dim);border-radius:14px;padding:30px 28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:ovIn .35s cubic-bezier(.2,1.3,.4,1) both;max-height:calc(100vh - 40px);overflow:auto}
@keyframes ovIn{from{opacity:0;transform:scale(.9) translateY(16px)}}
.ovc.paper{background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--paper-ink);border-color:#b89c62}
.ovc h2{font-family:var(--f-title);font-weight:900;font-size:26px}
.ovc p{color:var(--fg2);line-height:1.85;font-size:15px}
.ovc.paper p{color:var(--paper-mut)}
.ov-k{font-family:var(--f-sc);letter-spacing:.24em;color:var(--brass);font-size:14px}
.ovc.paper .ov-k{color:var(--ink-red)}
.ov-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.splash{text-align:center;align-items:center;background:radial-gradient(ellipse at 50% 0%,#2a3350,#121624 70%)}
.splash .bigrn{font-family:var(--f-sc);font-size:clamp(80px,14vw,130px);line-height:.85;color:var(--brass);text-shadow:0 0 40px rgba(255,181,71,.35)}
.splash .when{font-family:var(--f-fell);font-size:17px;color:var(--fg2);letter-spacing:.08em}
.splash h2{font-size:clamp(28px,4vw,36px)}
.splash .hook{font-family:var(--f-hand);font-size:18px;color:#d8d0bf}
.clear .big{font-family:var(--f-sc);font-size:clamp(34px,6vw,52px);color:var(--brass-hi);letter-spacing:.08em;line-height:1;text-shadow:0 0 30px rgba(255,217,138,.4)}
.bigstars{display:flex;gap:14px;justify-content:center;font-size:58px;line-height:1;margin:6px 0}
.bigstars span{color:#2c3346;transform:scale(.4);opacity:.4;transition:all .35s cubic-bezier(.2,1.8,.4,1)}
.bigstars span.on{color:var(--brass-hi);transform:scale(1);opacity:1;text-shadow:0 0 22px rgba(255,217,138,.75)}
.tally{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;font-family:var(--f-mono);font-weight:600;font-size:20px}
.tally span{display:flex;align-items:center;gap:6px}
.tally .x{color:var(--xp)} .tally .c{color:var(--brass-hi)}
.clear .sum{display:flex;flex-direction:column;gap:8px;text-align:left;background:rgba(0,0,0,.25);border-radius:8px;padding:14px 16px;font-family:var(--f-title);font-size:15.5px;line-height:1.85;color:#d8d0bf;max-height:220px;overflow:auto}
.clear .sum .ladder td:nth-child(2){color:var(--brass)}
.lvup{text-align:center;align-items:center;overflow:hidden}
.lvup .rays{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,217,138,.08) 0 10deg,transparent 10deg 20deg);animation:spin 20s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lvup .lvnum{font-family:var(--f-mono);font-weight:600;font-size:72px;line-height:1;color:var(--xp);text-shadow:0 0 30px rgba(143,180,255,.6);position:relative}
.lvup *{position:relative}
.item .formula{font-family:var(--f-title);font-size:20px;line-height:1.95;background:rgba(43,32,20,.06);border:1px solid #c4ad7d;border-radius:8px;padding:14px 16px}
.item .formula .ladder td:nth-child(2){color:var(--ink-red)}
.ovc label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--fg2);letter-spacing:.06em}
.ovc input[type=text]{font-family:var(--f-title);font-size:18px;padding:10px 12px;border:1px solid #3d4558;border-radius:6px;background:#0c0f18;color:var(--fg)}
.ovc input[type=text]:focus{outline:none;border-color:var(--brass)}
.ovc label.ck{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);cursor:pointer}
.ovc input[type=checkbox]{accent-color:var(--brass);width:16px;height:16px}
.loglist{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow:auto;padding-right:6px}
.loglist div{font-family:var(--f-hand);font-size:16px;line-height:1.75}
.loglist b{font-family:var(--f-title);font-size:13px;color:var(--brass);letter-spacing:.1em;display:block}
.loglist .n{color:var(--fg2);font-family:var(--f-title);font-size:14.5px}
.credit{font-family:var(--f-fell);font-style:italic;color:var(--fg3);font-size:15px}

/* toast, floats, fx */
.toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{display:flex;gap:12px;align-items:center;background:linear-gradient(180deg,#2a2f42,#1a1e2c);border:1px solid var(--brass);border-radius:10px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:tIn .35s cubic-bezier(.2,1.4,.4,1) both;width:100%}
.toast.out{animation:tOut .3s ease forwards}
@keyframes tIn{from{opacity:0;transform:translateY(-20px)}}
@keyframes tOut{to{opacity:0;transform:translateY(-14px)}}
.toast .medal{width:40px;height:40px;font-size:15px;flex:none}
.toast b{display:block;font-family:var(--f-title);font-size:15px}
.toast span{font-size:12.5px;color:var(--fg2)}
.float{position:fixed;z-index:85;pointer-events:none;font-family:var(--f-mono);font-weight:700;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.6);animation:floatUp 1.1s ease-out forwards;white-space:nowrap}
.float.x{color:var(--xp)} .float.c{color:var(--brass-hi)} .float.b{color:var(--bad)}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-60px)}}
#fx{position:fixed;inset:0;z-index:84;pointer-events:none;width:100%;height:100%}

@media (max-width:860px){
  .arena{grid-template-columns:minmax(0,1fr)}
  .sprite{display:none}
  .dface{display:block}
  .benchbtn{display:inline-flex}
  .arena .bench,.sheetable .bench{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;max-height:78vh;overflow:auto;border-radius:14px 14px 0 0;padding:18px var(--gr) calc(20px + env(safe-area-inset-bottom,0px)) var(--gl)}
  .arena .bench.open,.sheetable .bench.open{display:block;animation:sheet .3s ease both}
  .wb-x{display:inline-flex}
  .ptool.tobench.has{display:inline-flex}
  .prog{width:70px}
  .dbox{padding:22px 18px 30px}
  .stamp{width:88px;height:88px;font-size:22px;top:50px;right:14px}
}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}

/* ===== voyage + escape-room skin ===== */
.mapbox{background:#e6d6aa;border-color:#8a6a2a}
.mapcap{color:#5a3a14;opacity:1}
.pz-h{padding-right:74px}
.padlock{position:absolute;right:16px;top:-36px;width:58px;height:76px;filter:drop-shadow(0 5px 6px rgba(0,0,0,.45));pointer-events:none;z-index:2}
.padlock .shk{transition:transform .45s cubic-bezier(.2,1.6,.4,1);transform-box:view-box;transform-origin:46px 36px}
.pz.unlocked .padlock .shk{transform:translateY(-9px) rotate(-30deg)}
.pz.rattle .padlock{animation:rattle .45s ease}
@keyframes rattle{20%{transform:rotate(-10deg)}40%{transform:rotate(9deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.pz-in input{background:linear-gradient(#0e0c0a,#241c14 50%,#0e0c0a);color:#ffd98a;border:2px solid #a8822f;font-family:"Special Elite","IBM Plex Mono",monospace;letter-spacing:.12em;box-shadow:inset 0 0 10px #000}
.pz-in input::placeholder{color:#8a7350;letter-spacing:.02em;font-family:var(--f-ui);font-size:14px}
.pz-in input:focus{border-color:#ffd98a;box-shadow:inset 0 0 10px #000,0 0 0 3px rgba(255,217,138,.3)}
.pz-in input:disabled{opacity:.85}
.opt{background:linear-gradient(#f8efd6,#efe2bf)}
.opt .ol{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(#f0d48a,#a8822f);color:#2b1a0a;font-size:15px;box-shadow:0 2px 0 #6e5320;align-self:center}
.invbar{max-width:1120px;margin:0 auto 24px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inv-k{font-family:"Special Elite",var(--f-mono);font-size:12px;letter-spacing:.18em;color:var(--brass);margin-right:4px;text-shadow:0 1px 2px #000}
.slot{width:64px;height:64px;border:2px solid #5a4630;background:rgba(10,8,6,.78);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--fg2);cursor:pointer;padding:4px;line-height:1.2;text-align:center}

/* =========================================================

let uid=0;
const COIN='<svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.2" fill="#e8bd62" stroke="#8a6a24" stroke-width="1.8"/><circle cx="10" cy="10" r="4.6" fill="none" stroke="#8a6a24" stroke-width="1.4"/></svg>';
const KEYI='<svg class="ic" viewBox="0 0 20 20" aria-hidden="true"><circle cx="6" cy="10" r="4" fill="none" stroke="#ffd98a" stroke-width="2.2"/><path d="M10 10h8M15 10v4M18 10v3" stroke="#ffd98a" stroke-width="2.2"/></svg>';

/* =========================================================
   log table (3 significant digits)
   ========================================================= */
const MT={};
for(let k=100;k<1000;k++) MT[k]=Math.round(Math.log10(k/100)*1e4)/1e4;
const m4=k=>String(Math.round(MT[k]*1e4)).padStart(4,'0');
function fmtSig(d,n){
  const L=n+1; let s;
  if(L<=0) s='0.'+'0'.repeat(-L)+d;
  else if(L>=3) s=d+'0'.repeat(L-3);
  else s=d.slice(0,L)+'.'+d.slice(L);
  if(s.includes('.')) s=s.replace(/0+$/,'').replace(/\.$/,'');
  return s;
}
function toKey(x){
  if(!(x>0)||!isFinite(x)) return null;
  let e=Math.floor(Math.log10(x)); let k=Math.round(x/Math.pow(10,e)*100);
  if(k>=1000){k=100;e++;} if(k<100) k=100;
  return {k,e};
}
function nearestCell(m){
  let best=100,bd=9;
  for(let k=100;k<1000;k++){const d=Math.abs(MT[k]-m);if(d<bd){bd=d;best=k;}}
  if(Math.abs(1-m)<bd) return {k:100,carry:1};
  return {k:best,carry:0};
}
const randDigits=()=>String(ri(1,9))+ri(0,9)+ri(0,9);

/* =========================================================
   save data
   ========================================================= */
const KEY='napier-logtable-v2';
function fresh(){return {v:2,name:'',xp:0,coins:20,done:{},stars:{},run:{},m:{},badges:{},unlockAll:false,dn:0,bestStreak:0,rushBest:0,muted:false,hintUsed:false,firstOk:false,student:null,logUrl:'',lastSync:0};}
const CUR='napier-current-student';
const skey=sid=>sid?KEY+':'+sid:KEY;
const sidOf=st=>st?`${st.cls}-${st.seat}`:'';
function loadKey(k){try{const s=JSON.parse(localStorage.getItem(k));if(s&&s.v===2)return Object.assign(fresh(),s);}catch(e){}return null;}
function load(){let sid='';try{sid=localStorage.getItem(CUR)||'';}catch(e){}return (sid&&loadKey(skey(sid)))||loadKey(KEY)||fresh();}
let S=load();
function save(){try{localStorage.setItem(skey(sidOf(S.student)),JSON.stringify(S));}catch(e){}}
const toHalf=v=>String(v||'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248));

/* =========================================================
   learning log → Google Sheets (Apps Script)
   ========================================================= */
const QKEY='napier-log-queue';
let LQ=[];try{LQ=JSON.parse(localStorage.getItem(QKEY))||[];}catch(e){LQ=[];}
let flushT=0,inflight=false;
const logUrl=()=>String(S.logUrl||LOG_URL||'').trim();
const strip=h=>String(h==null?'':h).replace(/<sup>(.*?)<\/sup>/g,'^$1').replace(/<sub>(.*?)<\/sub>/g,'_$1').replace(/<br\s*\/?>/g,' ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();
function saveQ(){try{localStorage.setItem(QKEY,JSON.stringify(LQ));}catch(e){}}
function logEv(type,d){
  if(!S.student) return;
  LQ.push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),t:new Date().toISOString(),type,st:Object.assign({},S.student)},d||{}));
  if(LQ.length>3000) LQ=LQ.slice(-3000);
  saveQ(); scheduleFlush();
}
function logAnswer(mode,q,first,ok,revealed,info,extra){
  const isC=q.type==='choice';
  logEv('answer',Object.assign({mode,skillName:q.skill?SK[q.skill].name:'暖身',question:strip(q.prompt),
    correct:isC?'ABCD'[q.answer]+'. '+strip(q.choices[q.answer]):strip(ansText(q)),
    given:(info&&info.attempts||[]).join(' | '),first:!!first,ok:!!ok,revealed:!!revealed,
    tries:info?info.attempts.length:0,hint:!!(info&&info.hint),sec:info?Math.round(info.ms/100)/10:0},extra||{}));
}
function curText(){
  const i=CH.findIndex((_,k)=>S.run[k]&&S.run[k].idx>0&&!S.done[k]);
  if(i<0){const d=CH.filter((_,k)=>S.done[k]).length;return d>=8?'全部通關':d?`已通關 ${d} 章`:'尚未開始';}
  const keys=CH[i].steps.slice(0,S.run[i].idx).filter(x=>x.t==='q').length;
  return `第 ${RN[i]} 章 ${CH[i].room}：${keys}/${CH[i].qn} 道鎖`;
}
function summary(){
  return {ts:Date.now(),st:S.student,lv:levelOf(S.xp),xp:S.xp,coins:S.coins,done:CH.filter((_,i)=>S.done[i]).length,stars:CH.map((_,i)=>S.stars[i]||0),
    dn:S.dn,rush:S.rushBest,badges:Object.keys(S.badges).length,cur:curText(),
    skills:SKILLS.map(k=>{const m=S.m[k.id]||{n:0,c:0};return {name:k.name,lv:level(k.id),n:m.n,c:m.c};})};
}
function scheduleFlush(){clearTimeout(flushT);flushT=setTimeout(flush,1500);}
function flush(){
  const url=logUrl(); if(!url||inflight||!S.student) return;
  const batch=LQ.slice(0,40); const ids=new Set(batch.map(e=>e.id));
  if(typeof fetch!=='function') return;
  inflight=true;
  fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({v:1,events:batch,summary:summary()})})
    .then(()=>{LQ=LQ.filter(e=>!ids.has(e.id));saveQ();S.lastSync=Date.now();save();inflight=false;if(LQ.length)scheduleFlush();})
    .catch(()=>{inflight=false;clearTimeout(flushT);flushT=setTimeout(flush,20000);});
}
function beaconFlush(){
  const url=logUrl(); if(!url||inflight||!S.student||!navigator.sendBeacon) return;
  const batch=LQ.slice(0,40);
  try{if(navigator.sendBeacon(url,new Blob([JSON.stringify({v:1,events:batch,summary:summary()})],{type:'text/plain;charset=utf-8'}))){const ids=new Set(batch.map(e=>e.id));LQ=LQ.filter(e=>!ids.has(e.id));saveQ();}}catch(e){}
}
function syncText(){
  if(!logUrl()) return '尚未設定紀錄網址：作答紀錄只存在這台裝置，老師看不到。';
  return `作答紀錄會自動上傳給老師。待上傳 ${LQ.length} 筆${S.lastSync?`，上次上傳 ${new Date(S.lastSync).toLocaleString('zh-TW',{hour12:false})}`:''}。`;
}
function record(skill,ok){
  if(!skill) return;
  const m=S.m[skill]||(S.m[skill]={n:0,c:0,r:[]});
  m.n++; if(ok) m.c++; m.r.push(ok?1:0); if(m.r.length>8) m.r.shift(); save();
}
function level(id){
  const m=S.m[id]; if(!m||!m.n) return 0;

  if(ok>=3) return 2;

}
const LV_NAME=['未接觸','練習中','熟悉','精熟'];
const TIER=['LOCKED','BRONZE','SILVER','GOLD'];
const lvlXP=n=>30*(n-1)*n;
function levelOf(xp){let n=1;while(xp>=lvlXP(n+1))n++;return n;}
const RANKS=['見習學徒','抄寫員','計算員','首席助手','天文助理','對數學者','皇家計算師','傳說計算師'];
const rankOf=lv=>RANKS[Math.min(lv-1,RANKS.length-1)];
const pname=()=>S.name||'助手';

/* =========================================================
   sound (synthesized, starts after a user gesture)
   ========================================================= */
const SFX={ctx:null,bus:null,unlocked:false};
function makeCtx(){
  if(SFX.ctx) return SFX.ctx;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
  try{
    try{if(navigator.audioSession) navigator.audioSession.type='playback';}catch(e){}
    const c=new AC();
    const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.knee.value=8;comp.ratio.value=4;
    const g=c.createGain();g.gain.value=0.9;g.connect(comp).connect(c.destination);

  }catch(e){return null;}

/* 瀏覽器規定：聲音必須在使用者第一次點擊或按鍵時「解鎖」 */
function unlockAudio(){
  const c=makeCtx(); if(!c) return;
  if(c.state!=='running'){try{c.resume();}catch(e){}}
  if(!SFX.unlocked){try{const b=c.createBuffer(1,1,22050),src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start(0);SFX.unlocked=true;}catch(e){}}

['pointerdown','touchend','keydown','click'].forEach(ev=>window.addEventListener(ev,unlockAudio,{capture:true,passive:true}));

  if(S.muted) return;
  const c=makeCtx(); if(!c) return;
  if(c.state==='running'){fn(c,SFX.bus);return;}
  try{c.resume().then(()=>{if(c.state==='running')fn(c,SFX.bus);}).catch(()=>{});}catch(e){}

function tone(f,d,type,vol,delay){
  withCtx((c,bus)=>{const t=c.currentTime+0.01+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
    const v=Math.min(0.6,(vol||.08)*2.6);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);

    case 'coin': tone(988,.07,'square',.035); tone(1319,.16,'square',.035,.06); break;

/* =========================================================
   fx: particles, floating numbers, toasts
   ========================================================= */
const FX={c:$('#fx'),ps:[],raf:0};
function burst(x,y,n,colors){
  if(reduce) return;
  const c=FX.c,dpr=window.devicePixelRatio||1;
  if(c.width!==innerWidth*dpr){c.width=innerWidth*dpr;c.height=innerHeight*dpr;}
  for(let i=0;i<(n||30);i++) FX.ps.push({x:x*dpr,y:y*dpr,vx:(Math.random()-.5)*9*dpr,vy:(-Math.random()*8-2)*dpr,life:1,col:pick(colors||['#ffd98a','#e0b45a','#5fd1b3','#8fb4ff','#fff3d2']),s:(2+Math.random()*4)*dpr,r:Math.random()*6});
  if(!FX.raf) FX.raf=requestAnimationFrame(fxLoop);
}
function fxLoop(){
  const c=FX.c,ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  const dpr=window.devicePixelRatio||1;
  FX.ps=FX.ps.filter(p=>p.life>0);
  for(const p of FX.ps){p.vy+=.28*dpr;p.x+=p.vx;p.y+=p.vy;p.life-=.016;p.r+=.15;ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.col;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();}
  FX.raf=FX.ps.length?requestAnimationFrame(fxLoop):0;
  if(!FX.raf) ctx.clearRect(0,0,c.width,c.height);
}
function centerOf(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+Math.min(r.height/2,120)];}
function floatText(x,y,html,cls){const f=E('div','float '+(cls||''),html);f.style.left=(x-20)+'px';f.style.top=y+'px';document.body.append(f);setTimeout(()=>f.remove(),1200);}
function toast(title,desc,medal){
  const t=E('div','toast',`${medal?`<div class="medal">${medal}</div>`:''}<div><b>${title}</b>${desc?`<span>${desc}</span>`:''}</div>`);
  $('#toasts').append(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),320);},2800);
}

let ovChain=Promise.resolve(); let ovOpen=0;
function overlay(build){
  ovChain=ovChain.then(()=>new Promise(res=>{
    ovOpen++;
    const o=E('div','ov'); o.setAttribute('role','dialog'); o.setAttribute('aria-modal','true');
    const close=v=>{if(o._closed)return;o._closed=true;o.classList.add('out');setTimeout(()=>{o.remove();ovOpen--;res(v);},200);};
    build(o,close);
    document.body.append(o);
    const pr=o.querySelector('[data-primary]'); if(pr) setTimeout(()=>pr.focus({preventScroll:true}),50);
  }));
  return ovChain;
}

function parseNum(str){
  let s=String(str||'').trim()
    .replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-65248))
    .replace(/[．。]/g,'.').replace(/[−–—－]/g,'-').replace(/／/g,'/').replace(/[，,\s]/g,'');
  if(!s) return NaN;
  const fr=s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if(fr){const d=parseFloat(fr[2]);return d===0?NaN:parseFloat(fr[1])/d;}
  if(!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  return parseFloat(s);
}
function isRight(q,v){
  if(q.rtol) return Math.abs(v-q.answer)<=Math.abs(q.answer)*q.rtol+1e-12;
  return Math.abs(v-q.answer)<=(q.tol??1e-6)+1e-12;
}
function ansText(q){
  if(q.type==='choice') return q.choices[q.answer];
  if(q.show) return q.show;
  return minus(String(Number(q.answer.toFixed(4))));
}
const HINT_COST=5;
/* opts: no, tag, reward{xp,c}, hints, single, bench, onWrong(first), onDone(firstTry, ok, revealed) */
function buildPuzzle(q,opts){
  const card=E('div','pz enter');
  const rw=opts.reward?`<span>${XPI}+${opts.reward.xp}</span><span>${COIN}+${opts.reward.c}</span>`:'';
  card.innerHTML=`<div class="pz-h"><span class="pz-no">${opts.no||'Puzzle'}</span><span class="pz-tag">${opts.tag||''}</span><span class="pz-rw">${rw}</span></div><div class="pz-p">${q.prompt}</div>`;
  const tools=E('div','pz-tools'), fb=E('div','pz-fb'), nx=E('div','pz-next'), stamp=E('div','stamp');
  fb.setAttribute('aria-live','polite');
  let tries=0, finished=false, hintShown=false; const t0=performance.now(), attempts=[];
  const lock=()=>card.querySelectorAll('input,button.opt,.pz-in .gbtn').forEach(x=>x.disabled=true);
  const hintText=()=>q.hint||(q.skill?`想想這條：${SK[q.skill].f}`:'再讀一次題目，看看工作台上有什麼可以用。');
  const showStamp=(ok,text)=>{stamp.className='stamp'+(ok?' ok':'');stamp.textContent=text;void stamp.offsetWidth;stamp.classList.add('show');};
  const finish=(ok,revealed)=>{
    if(finished) return; finished=true; lock(); tools.innerHTML='';
    let html=ok?'':`<p class="bad">答案是 <b>${ansText(q)}</b></p>`;
    if(q.explain) html+=`<p class="ex">${q.explain}</p>`;
    fb.innerHTML=html;
    if(ok){card.classList.add('unlocked');showStamp(true,tries===0?'開鎖':'過關');sfx('unlock');setTimeout(()=>sfx('ok'),180);const [x,y]=centerOf(stamp);burst(x,y,tries===0?40:18);}
    opts.onDone&&opts.onDone(ok&&tries===0,ok,!!revealed,{attempts:attempts.slice(),hint:hintShown,ms:performance.now()-t0});
  };
  const wrong=msg=>{
    tries++;
    card.classList.remove('shake','rattle');void card.offsetWidth;card.classList.add('shake','rattle');sfx('bad');
    opts.onWrong&&opts.onWrong(tries===1);
    if(opts.single){finish(false);return;}
    let html=`<p class="bad">${msg}</p>`;
    if(hintShown) html+=`<p class="hint">提示：${hintText()}</p>`;
    fb.innerHTML=html;
    if(tries>=2&&!tools.querySelector('.reveal')){
      const rb=E('button','ptool reveal','看解答（不得分）');rb.type='button';rb.onclick=()=>finish(false,true);tools.append(rb);
    }
  };
  if(q.type==='choice'){
    const grid=E('div','opts');
    q.choices.forEach((c,i)=>{
      const b=E('button','opt',`<span class="ol">${'ABCD'[i]}</span><span>${c}</span>`);b.type='button';
      b.onclick=()=>{if(finished)return;attempts.push('ABCD'[i]+'. '+strip(c));if(i===q.answer){b.classList.add('yes');finish(true);}else{b.classList.add('no');b.disabled=true;wrong('不是這個。');}};
      grid.append(b);
    });
    card.append(grid);
  } else {
    const row=E('div','pz-in');
    const inp=E('input');inp.id='ans'+(++uid);inp.type='text';inp.autocomplete='off';inp.spellcheck=false;
    inp.setAttribute('aria-label','你的答案');inp.placeholder=q.ph||'輸入答案';
    const sb=E('button','gbtn sm','開鎖');sb.type='button';
    const submit=()=>{
      if(finished)return;
      const v=parseNum(inp.value);
      if(Number.isNaN(v)){fb.innerHTML='<p class="bad">請輸入一個數，可以用小數、負數或分數，例如 −1.5 或 3/2。</p>';return;}
      attempts.push(inp.value.trim());
      if(isRight(q,v)) finish(true); else {wrong(`${esc(minus(inp.value.trim()))} 不對。`);if(!finished){inp.select();}}
    };
    sb.onclick=submit;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();submit();}});
    const qk=E('div','qkeys');qk.setAttribute('aria-label','符號快捷鍵');
    [['−','-','輸入負號'],['/','/','輸入分數線'],['.','.','輸入小數點'],['⌫','BS','刪除一個字']].forEach(([lab,v,al])=>{
      const k=E('button','qk',lab);k.type='button';k.setAttribute('aria-label',al);
      k.addEventListener('pointerdown',e=>e.preventDefault());
      k.onclick=()=>{if(finished)return;const st=inp.selectionStart??inp.value.length,en=inp.selectionEnd??st;
        if(v==='BS'){if(st===en&&st>0){inp.value=inp.value.slice(0,st-1)+inp.value.slice(en);inp.setSelectionRange(st-1,st-1);}else{inp.value=inp.value.slice(0,st)+inp.value.slice(en);inp.setSelectionRange(st,st);}}
        else{inp.value=inp.value.slice(0,st)+v+inp.value.slice(en);inp.setSelectionRange(st+1,st+1);}
        inp.focus({preventScroll:true});sfx('tick');};
      qk.append(k);});
    row.append(inp,qk,sb); card.append(row);
  }
  if(opts.hints){
    const hb=E('button','ptool',`提示 −${HINT_COST} ${COIN}`);hb.type='button';
    hb.onclick=()=>{
      if(S.coins<HINT_COST){toast('銀幣不夠','去接計算委託可以賺銀幣。');sfx('bad');return;}
      S.coins-=HINT_COST;S.hintUsed=true;save();updateHud();sfx('coin');hintShown=true;hb.remove();
      const [x,y]=centerOf(hb.parentElement||card);floatText(x,y,`−${HINT_COST} ${COIN}`,'b');
      fb.innerHTML=`<p class="hint">提示：${hintText()}</p>`;checkBadges();
    };
    tools.append(hb);
  }
  if(opts.bench){const tb=E('button','ptool tobench has','打開工作台');tb.type='button';tb.onclick=()=>openSheet();tools.append(tb);}
  card.append(tools,fb,nx,stamp);
  card.insertAdjacentHTML('afterbegin',PADLOCK);
  card.nextSlot=nx;
  card.focusFirst=()=>{const i=card.querySelector('input');if(i)i.focus({preventScroll:true});else{const o=card.querySelector('.opt');if(o&&!narrow())o.focus({preventScroll:true});}};
  return card;
}

function buildPow2(){

    btn.onclick=()=>{if(marked.has(n))marked.delete(n);else marked.add(n);btn.classList.toggle('on');btn.setAttribute('aria-pressed',String(marked.has(n)));sfx('tick');

function buildCurve(){
  const W=420,H=300,L=40,R=14,T=12,B=30,x0=-2,x1=5,y1=32;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R), sy=y=>H-B-y/y1*(H-T-B);

function buildLogTable(){

  const id=++uid;
  w.insertAdjacentHTML('beforeend',`<div class="lt-tools">

    <label for="ltM${id}">找尾數<input class="tin" id="ltM${id}" type="text" inputmode="decimal" placeholder="例如 0.8000" autocomplete="off"></label>
  </div><div class="lt-read" aria-live="polite">點表格中的任何一格。</div>`);
  const wrap=E('div','lt-wrap');wrap.tabIndex=0;wrap.setAttribute('aria-label','常用對數表');
  let h='<table class="lt"><thead><tr><th scope="col">N</th>';
  for(let c=0;c<10;c++) h+=`<th scope="col"${c===5?' class="c5"':''}>${c}</th>`;
  h+='</tr></thead><tbody>';
  for(let r=10;r<100;r++){h+=`<tr data-r="${r}"${r%5===4?' class="b5"':''}><th scope="row">${r}</th>`;for(let c=0;c<10;c++){const k=r*10+c;h+=`<td data-k="${k}"${c===5?' class="c5"':''}>${m4(k)}</td>`;}h+='</tr>';}
  wrap.innerHTML=h+'</tbody></table>'; w.append(wrap);
  const read=w.querySelector('.lt-read');
  const clear=()=>{wrap.querySelectorAll('.hit').forEach(x=>x.classList.remove('hit'));wrap.querySelectorAll('.rh').forEach(x=>x.classList.remove('rh'));};
  const scrollTo=el=>{wrap.scrollTop=Math.max(0,el.offsetTop-wrap.clientHeight/2+20);};
  const hitCell=(k,extra)=>{clear();const td=wrap.querySelector(`td[data-k="${k}"]`);if(!td)return;td.classList.add('hit');td.parentElement.classList.add('rh');scrollTo(td.parentElement);
    read.innerHTML=`log ${(k/100).toFixed(2)} = 0.${m4(k)}`+(extra?`<span class="m">${extra}</span>`:'');sfx('tick');};
  wrap.addEventListener('click',e=>{const td=e.target.closest('td');if(td)hitCell(+td.dataset.k);});
  const go=w.querySelector(`#ltGo${id}`);
  const doGo=()=>{const t=toKey(parseNum(go.value));if(!t){read.innerHTML='<span class="m">請輸入一個正數，例如 4.73 或 0.0258。</span>';return;}
    const shown=fmtSig(String(t.k),t.e);let extra=`${shown} = ${(t.k/100).toFixed(2)} × 10${sup(minus(t.e))}，首數是 ${minus(t.e)}。`;
    const raw=String(go.value).replace(/[^\d]/g,'').replace(/^0+/,'');if(raw.replace(/0+$/,'').length>3)extra='表只有三位有效數字，已取最接近的一格。'+extra;hitCell(t.k,extra);};
  go.addEventListener('change',doGo);go.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();doGo();}});
  const mi=w.querySelector(`#ltM${id}`);
  const doM=()=>{const v=parseNum(mi.value);if(Number.isNaN(v)){read.innerHTML='<span class="m">請輸入一個對數值，例如 0.8000 或 2.2597。</span>';return;}
    const n=Math.floor(v+1e-9),m=v-n;let row=10;for(let r=10;r<100;r++)if(MT[r*10]<=m+1e-9)row=r;
    clear();const tr=wrap.querySelector(`tr[data-r="${row}"]`);tr.classList.add('rh');scrollTo(tr);sfx('tick');
    read.innerHTML=`尾數 0.${String(Math.round(m*1e4)).padStart(4,'0')} 在 N = ${row} 這一列附近<span class="m">在亮起的這一列（或下一列開頭）找最接近的一格。${n!==0?`首數是 ${minus(n)}，最後要乘以 10${sup(minus(n))}。`:'首數是 0，答案介於 1 和 10 之間。'}</span>`;};
  mi.addEventListener('change',doM);mi.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();doM();}});
  return w;
}

function sailShip(from,to){

  const [x1,y1]=NODES[from],[x2,y2]=NODES[to];const mx=(x1+x2)/2+(from===6?0:(from%2?30:-30)),my=(y1+y2)/2+(from===6?-70:10);
  const t0=performance.now(),dur=reduce?1:2400;sfx('open');
  const step=now=>{const t=Math.min(1,(now-t0)/dur),e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,u=1-e;const x=u*u*x1+2*u*e*mx+e*e*x2,y=u*u*y1+2*u*e*my+e*e*y2;
    sh.setAttribute('transform',`translate(${x.toFixed(1)} ${(y-30+Math.sin(t*Math.PI*6)*2).toFixed(1)})`);
    if(t<1)requestAnimationFrame(step);else{toast(`抵達第 ${RN[to]} 港`,`「${CH[to].room}」的門還鎖著。`);sfx('star');}};
  requestAnimationFrame(step);
}

function savePos(){save();updateProg();}
function advance(){P.run.idx++;savePos();next();}
function next(){

function typeInto(el,html,done){
  el.innerHTML=html;
  let called=false;const fin=()=>{if(!called){called=true;done();}};
  if(reduce){fin();return{typing:false,skip(){}};}
  const nodes=[];const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);while(tw.nextNode())nodes.push(tw.currentNode);
  const texts=nodes.map(n=>n.nodeValue);nodes.forEach(n=>n.nodeValue='');
  let ni=0,ci=0;const obj={typing:true,skip(){if(!obj.typing)return;clearInterval(tm);obj.typing=false;nodes.forEach((n,i)=>n.nodeValue=texts[i]);fin();}};
  const tm=setInterval(()=>{for(let k=0;k<2;k++){if(ni>=nodes.length){clearInterval(tm);obj.typing=false;fin();return;}ci++;nodes[ni].nodeValue=texts[ni].slice(0,ci);if(ci>=texts[ni].length){ni++;ci=0;}}},28);
  return obj;
}
function dlgAdvance(){
  if(!P||P.mode!=='dlg'||ovOpen)return;

  sfx('tick'); P.mode='idle'; advance();

function showQuestion(s){
  P.mode='q';
  $('#dbox').classList.add('hide');
  const sp=$('#sprite');sp.style.opacity='0';sp.dataset.who='';
  $('#left').classList.add('q');
  const slot=$('#pzSlot');slot.innerHTML='';
  const reward=s.skill?{xp:10,c:5}:{xp:5,c:2};
  const card=buildPuzzle(s,{no:`鎖 No. ${String(s.no).padStart(3,'0')}`,tag:s.skill?SK[s.skill].name:'暖身',reward,hints:true,bench:!!P.bench,
    onWrong:first=>{
      if(first&&!P.lost.has(s.no)){P.lost.add(s.no);
        if(P.run.candles>0){P.run.candles--;save();renderCandles(P.run.candles);sfx('candle');toast('一根蠟燭熄滅了',`還剩 ${P.run.candles} 根。通關時剩幾根就拿幾顆星。`);}
      }
    },
    onDone:(first,ok,revealed,info)=>{
      if(s.skill) record(s.skill,first);
      logAnswer('劇情',s,first,ok,revealed,info,{ch:P.ci+1,room:CH[P.ci].room,q:s.no});
      setKeys(CH[P.ci].steps.slice(0,P.run.idx+1).filter(x=>x.t==='q').length);

        const xp=first?reward.xp:Math.ceil(reward.xp/2),co=first?reward.c:Math.ceil(reward.c/2);

      card.nextSlot.append(b);b.focus({preventScroll:true});
    }});

     ${last?`<p>從 2 的次方表到克卜勒的行星週期，你走完了納皮爾和布里格斯花三十年走的航線。接下來去港口接委託，把 16 張技能卡都練到金色。</p>`:''}

const LV={2:0.3010,3:0.4771,7:0.8451,10:1};
const GIVEN='已知 log 2 ≈ 0.3010、log 3 ≈ 0.4771、log 7 ≈ 0.8451';
const num=(prompt,answer,x)=>Object.assign({type:'num',prompt,answer},x||{});
function choice(prompt,right,wrongs,x){const all=shuffle([right,...wrongs]);return Object.assign({type:'choice',prompt,choices:all,answer:all.indexOf(right)},x||{});}
const fracDisp=(p,q)=>p<0?`−${-p}/${q}`:`${p}/${q}`;
const G={
  S1(){const b=pick(['2','3','5','10','x']);const m=ri(2,9),n=ri(2,9);
    if(Math.random()<.4){const k=ri(2,6);return num(`${b}${sup(m)} × ${b}${sup(n)} × ${b}${sup(k)} = ${b}${sup('?')}`,m+n+k,{explain:`底數相同，指數相加：${m} + ${n} + ${k} = ${m+n+k}。`});}
    return num(`${b}${sup(m)} × ${b}${sup(n)} = ${b}${sup('?')}`,m+n,{explain:`底數相同，指數相加：${m} + ${n} = ${m+n}。`});},
  S2(){const b=pick(['2','3','7','10','a']);const m=ri(2,12),n=ri(2,12);
    if(Math.random()<.35){const k=ri(2,6);return num(`${b}${sup(m)} × ${b}${sup(k)} ÷ ${b}${sup(n)} = ${b}${sup('?')}`,m+k-n,{explain:`${m} + ${k} − ${n} = ${minus(m+k-n)}。`});}
    return num(`${b}${sup(m)} ÷ ${b}${sup(n)} = ${b}${sup('?')}`,m-n,{explain:`底數相同，指數相減：${m} − ${n} = ${minus(m-n)}。`});},
  S3(){const b=pick(['2','3','5','x']);const m=ri(2,6),n=ri(2,5);
    if(Math.random()<.35){const k=ri(1,5);return num(`(${b}${sup(m)})${sup(n)} × ${b}${sup(k)} = ${b}${sup('?')}`,m*n+k,{explain:`${m} × ${n} + ${k} = ${m*n+k}。`});}
    return num(`(${b}${sup(m)})${sup(n)} = ${b}${sup('?')}`,m*n,{explain:`次方的次方，指數相乘：${m} × ${n} = ${m*n}。`});},
  S4(){const b=pick([2,2,3]);const q=b===2?pick([2,3,4,5]):pick([2,3]);let p=pick([1,2,3,-1,-2]);if(p%q===0||(Math.abs(p)===2&&q===4))p=pick([1,3]);
    const base=b**q,val=b**p;const show=p<0?`1/${b**(-p)}`:String(val);
    return num(`${base}${sup(fracDisp(p,q))} = ?`,val,{tol:0.001,show,ph:'可輸入分數',explain:`${base} = ${b}${sup(q)}，所以 ${base}${sup(fracDisp(p,q))} = ${b}${sup(minus(p))} = ${show}。`});},
  S5(){const a=pick(['2','3','10','1/2','1/3']);const inc=!a.includes('/');const ad=inc?a:`(${a})`;
    const T=['圖形通過點 (0, 1)','圖形恆在 x 軸上方',inc?'x 增加時，y 也增加':'x 增加時，y 反而減少'];
    const F=['圖形通過點 (0, 0)','y 可能是負數',inc?'x 增加時，y 反而減少':'x 增加時，y 也增加','圖形通過點 (1, 0)','圖形和 x 軸交於一點'];
    return choice(`關於 y = ${ad}${sup('x')} 的圖形，哪一個敘述正確？`,pick(T),shuffle(F).slice(0,3),{explain:`a > 0 時，a${sup('x')} 永遠是正數，且 a${sup('0')} = 1。${inc?'底數大於 1，圖形遞增。':'底數介於 0 和 1 之間，圖形遞減。'}`});},
  S6(){const [a,x,b]=pick([[2,'5','32'],[3,'4','81'],[5,'3','125'],[10,'−2','0.01'],[4,'1/2','2'],[2,'−3','1/8'],[7,'2','49'],[9,'1/2','3'],[6,'2','36']]);
    if(Math.random()<.5) return choice(`${a}${sup(x)} = ${b} 寫成對數式是？`,`log${sub(a)} ${b} = ${x}`,[`log${sub(b)} ${a} = ${x}`,`log${sub(a)} ${x} = ${b}`,`log${sub(x)} ${b} = ${a}`],{explain:`a${sup('x')} = b ⇔ x = log${sub('a')} b，底數留在右下角。`});
    return choice(`log${sub(a)} ${b} = ${x} 寫成指數式是？`,`${a}${sup(x)} = ${b}`,[`${b}${sup(x)} = ${a}`,`${x}${sup(a)} = ${b}`,`${a}${sup(b)} = ${x}`],{explain:`x = log${sub('a')} b ⇔ a${sup('x')} = b。`});},
  S7(){
    if(Math.random()<.7){const a=pick([2,3,5,10]);let k=ri(-3,5);if(a===5&&k>4)k=4;
      const bs=k>=0?String(a**k):(a===10?String(10**k):`1/${a**(-k)}`);
      return num(`log${sub(a)} ${bs} = ?`,k,{explain:`${a}${sup(minus(k))} = ${bs}，所以答案是 ${minus(k)}。`});}
    const [a,b,v,fr,c,p,q]=pick([[4,8,1.5,'3/2',2,2,3],[8,4,2/3,'2/3',2,3,2],[4,32,2.5,'5/2',2,2,5],[8,16,4/3,'4/3',2,3,4],[9,27,1.5,'3/2',3,2,3],[27,9,2/3,'2/3',3,3,2],[25,125,1.5,'3/2',5,2,3],[16,8,.75,'3/4',2,4,3]]);
    return num(`log${sub(a)} ${b} = ?（可以輸入分數）`,v,{tol:0.002,show:fr,explain:`${a} = ${c}${sup(p)}，${b} = ${c}${sup(q)}，所以 ${a}${sup(fr)} = ${c}${sup(q)} = ${b}，答案是 ${fr}。`});},
  ...(()=>{
    const mk=items=>()=>{const it=pick(items);let v=0;for(const k in it.f)v+=it.f[k]*LV[k];v=Math.round(v*1e4)/1e4;
      return num(`${GIVEN}<br>${it.lab} = ?（到小數第四位）`,v,{tol:0.0006,given:GIVEN,explain:`${it.dec}，所以 ${it.lab} ≈ ${f4(v)}。`});};
    return {
      S8:mk([{lab:'log 6',dec:'6 = 2 × 3',f:{2:1,3:1}},{lab:'log 14',dec:'14 = 2 × 7',f:{2:1,7:1}},{lab:'log 21',dec:'21 = 3 × 7',f:{3:1,7:1}},{lab:'log 42',dec:'42 = 2 × 3 × 7',f:{2:1,3:1,7:1}},{lab:'log 60',dec:'60 = 2 × 3 × 10',f:{2:1,3:1,10:1}},{lab:'log 300',dec:'300 = 3 × 100',f:{3:1,10:2}},{lab:'log 0.21',dec:'0.21 = 3 × 7 ÷ 100',f:{3:1,7:1,10:-2}}]),
      S9:mk([{lab:'log 1.5',dec:'1.5 = 3 ÷ 2',f:{3:1,2:-1}},{lab:'log 3.5',dec:'3.5 = 7 ÷ 2',f:{7:1,2:-1}},{lab:'log 5',dec:'5 = 10 ÷ 2',f:{10:1,2:-1}},{lab:'log 0.7',dec:'0.7 = 7 ÷ 10',f:{7:1,10:-1}},{lab:'log (2/3)',dec:'2/3 = 2 ÷ 3',f:{2:1,3:-1}},{lab:'log (7/3)',dec:'7/3 = 7 ÷ 3',f:{7:1,3:-1}},{lab:'log 1.4',dec:'1.4 = 2 × 7 ÷ 10',f:{2:1,7:1,10:-1}}]),
      S10:mk([{lab:'log 8',dec:'8 = 2³',f:{2:3}},{lab:'log 9',dec:'9 = 3²',f:{3:2}},{lab:'log 27',dec:'27 = 3³',f:{3:3}},{lab:'log 49',dec:'49 = 7²',f:{7:2}},{lab:'log 16',dec:'16 = 2⁴',f:{2:4}},{lab:'log √2',dec:'√2 = 2<sup>1/2</sup>',f:{2:.5}},{lab:'log ∛3',dec:'∛3 = 3<sup>1/3</sup>',f:{3:1/3}},{lab:'log 72',dec:'72 = 2³ × 3²',f:{2:3,3:2}}]),
    };})(),
  S11(){const [a,b]=pick([[2,3],[3,2],[2,7],[7,2],[3,7],[7,3],[2,10],[3,10]]);const v=Math.round(LV[b]/LV[a]*1000)/1000;
    return num(`${GIVEN}<br>log${sub(a)} ${b} = ?（到小數第三位）`,v,{tol:0.003,given:GIVEN,explain:`log${sub(a)} ${b} = log ${b} ÷ log ${a} = ${LV[b].toFixed(4)} ÷ ${LV[a].toFixed(4)} ≈ ${v.toFixed(3)}。`});},
  S12(){const d=randDigits();const n=pick([-3,-2,-1,1,2,3,4,5]);const k=+d;const N=fmtSig(d,n);const ans=n+MT[k];const given=`已知 log ${(k/100).toFixed(2)} ≈ 0.${m4(k)}`;
    return num(`${given}<br>log ${N} = ?`,Math.round(ans*1e4)/1e4,{tol:0.00015,given,ph:'例如 −1.5884',explain:`${N} = ${(k/100).toFixed(2)} × 10${sup(minus(n))}，所以 log ${N} = ${minus(n)} + 0.${m4(k)} = ${f4(ans)}。`});},
  S13(){const d=randDigits();const n=ri(-3,4);const k=+d;const N=fmtSig(d,n);const ans=n+MT[k];
    return num(`查表：log ${N} = ?（到小數第四位）`,Math.round(ans*1e4)/1e4,{tol:0.00015,table:true,ph:'例如 −1.5884',explain:`${N} = ${(k/100).toFixed(2)} × 10${sup(minus(n))}。首數 ${minus(n)}，尾數查 N = ${Math.floor(k/10)}、欄 ${k%10} 得 0.${m4(k)}，所以 log ${N} = ${f4(ans)}。`});},
  S14(){const d=randDigits();const n=ri(-2,4);const k=+d;const Lg=n+MT[k];const N=fmtSig(d,n);
    return num(`log x = ${f4(Lg)}，x = ?`,parseFloat(N),{rtol:0.0004,table:true,show:N,explain:`${f4(Lg)} = ${minus(n)} + 0.${m4(k)}。尾數 0.${m4(k)} 對應 ${(k/100).toFixed(2)}，首數 ${minus(n)} 代表乘以 10${sup(minus(n))}，所以 x = ${N}。`});},
  S15(){const da=randDigits(),db=randDigits();const na=ri(0,2),nb=ri(0,1);const A=fmtSig(da,na),B=fmtSig(db,nb);const mul=Math.random()<.6;
    const la=na+MT[+da],lb=nb+MT[+db];const s=Math.round((mul?la+lb:la-lb)*1e4)/1e4;const ch=Math.floor(s+1e-9);const cell=nearestCell(s-ch);const approx=fmtSig(String(cell.k),ch+cell.carry);
    const exact=mul?parseFloat(A)*parseFloat(B):parseFloat(A)/parseFloat(B);
    return num(`用對數表計算：${A} ${mul?'×':'÷'} ${B} ≈ ?（取三位有效數字）`,exact,{rtol:0.012,table:true,show:approx,explain:`log ${A} = ${f4(la)}，log ${B} = ${f4(lb)}，${mul?'相加':'相減'}得 ${f4(s)}。尾數最接近 0.${m4(cell.k)}（${(cell.k/100).toFixed(2)}），首數 ${minus(ch+cell.carry)}，所以約 ${approx}。直接計算是 ${parseFloat(exact.toPrecision(6))}。`});},
  S16(){const d=randDigits();const op=pick([['sq',2,'2'],['cu',3,'3'],['p15',1.5,'1.5'],['sr',.5,'1/2'],['cr',1/3,'1/3']]);
    const n=op[0]==='cu'?0:ri(0,1);const X=fmtSig(d,n);const lx=n+MT[+d];
    const expr=op[0]==='sr'?`√${X}`:op[0]==='cr'?`∛${X}`:`(${X})${sup(op[2])}`;
    const s=Math.round(lx*op[1]*1e4)/1e4;const ch=Math.floor(s+1e-9);const cell=nearestCell(s-ch);const approx=fmtSig(String(cell.k),ch+cell.carry);
    const exact=Math.pow(parseFloat(X),op[1]);
    return num(`用對數表計算：${expr} ≈ ?（取三位有效數字）`,exact,{rtol:0.012,table:true,show:approx,explain:`log ${expr} = ${op[2]} × log ${X} = ${op[2]} × ${f4(lx)} = ${f4(s)}。尾數最接近 0.${m4(cell.k)}（${(cell.k/100).toFixed(2)}），首數 ${minus(ch+cell.carry)}，所以約 ${approx}。直接計算是 ${parseFloat(exact.toPrecision(6))}。`});},
};

const D={board:null,streak:0,focus:null};
const learned=()=>SKILLS.filter(s=>S.done[s.ch-1]).map(s=>s.id);
function pickSkill(exclude){
  const pool=(learned().length?learned():['S1','S2','S3','S4','S5','S6','S7']).filter(id=>!exclude||!exclude.includes(id));
  const ids=pool.length?pool:SKILLS.map(s=>s.id);const wts=ids.map(id=>[4,3,1.5,.7][level(id)]);
  let r=Math.random()*wts.reduce((a,b)=>a+b,0);for(let i=0;i<ids.length;i++){r-=wts[i];if(r<=0)return ids[i];}return ids[ids.length-1];
}
function mkNotice(skill,others){
  const sk=skill||pickSkill(others);const d=DIFF(sk);
  return {skill:sk,client:pick(CLIENTS),diff:d,rw:REWARD[d],rot:(Math.random()*4-2).toFixed(1)};
}
function fillBoard(force){
  if(D.focus){D.board=[0,1,2].map(()=>mkNotice(D.focus));return;}

function nextRush(){
  if(!R||R.over)return;
  const sk=pick(RUSH_SK);const q=G[sk]();q.skill=sk;R.count++;

  const card=buildPuzzle(q,{no:`快算 #${R.count}`,tag:SK[sk].name,single:true,
    onWrong:()=>{if(!R)return;R.end-=3000;R.combo=0;$('#rc').textContent='×1';const[x,y]=centerOf($('#rt'));floatText(x,y,'−3 秒','b');},

    const sk=Object.entries(bs).sort((a,b)=>a[1].first/a[1].n-b[1].first/b[1].n);
    const col=r=>r<.5?'var(--bad)':r<.75?'var(--brass)':'var(--ok)';
    html+=`<h2 style="font-family:var(--f-title);font-size:20px;margin:6px 0 12px">最多人卡關的劇情題目</h2>`+(qs.length?`<div class="bars">${qs.map(o=>{const r=o.first/o.n;const wr=Object.entries(o.wrong).sort((a,b)=>b[1]-a[1]).slice(0,3);return `<div class="barrow"><div class="q"><small>鎖 No. ${String(o.q).padStart(3,'0')} · ${esc(o.ch)} ${esc(o.room)} · ${esc(o.skill)}</small>${esc(o.question)}<small>正確答案：${esc(o.correct)}${wr.length?'　常見錯誤：'+wr.map(([w,c])=>`${esc(w)}（${c}）`).join('、'):''}</small></div><div class="m"><span>第一次答對 ${Math.round(r*100)}%（${o.first}/${o.n}）</span><div class="meterbar"><i style="width:${Math.max(3,r*100)}%;background:${col(r)}"></i></div><span>平均 ${(o.tries/o.n).toFixed(1)} 次 · ${Math.round(o.sec/o.n)} 秒${o.reveal?` · ${o.reveal} 人看解答`:''}</span></div></div>`;}).join('')}</div>`:'<div class="tempty">還沒有劇情作答紀錄。</div>')
      +`<h2 style="font-family:var(--f-title);font-size:20px;margin:28px 0 12px">技能答對率（含委託與快算）</h2>`+(sk.length?`<div class="bars">${sk.map(([k,o])=>{const r=o.first/o.n;return `<div class="barrow"><div class="q">${esc(k)}<small>${o.n} 次作答</small></div><div class="m"><span>第一次答對 ${Math.round(r*100)}%</span><div class="meterbar"><i style="width:${Math.max(3,r*100)}%;background:${col(r)}"></i></div></div></div>`;}).join('')}</div>`:'<div class="tempty">還沒有技能作答紀錄。</div>');
    out.innerHTML=html;
  } else {
    const fe=f.logs.slice(-60).reverse();
    html+=`<div class="tscroll" style="min-width:0"><div class="feed">${fe.map(l=>{let what=esc(l.ev);
      if(l.ev==='作答') what=`${l.first?'<span class="ok">一次答對</span>':l.ok?`<span class="bad">答錯 ${l.tries-1} 次後答對</span>`:'<span class="bad">看了解答</span>'}　${esc(l.mode)}${l.q?' 鎖 '+l.q:''} · ${esc(l.skill)}`;
      else if(l.note) what+=`　${esc(l.note)}`;
      if(l.room&&l.ev!=='作答') what+=`　${esc(l.ch)} ${esc(l.room)}`;
      return `<div><span class="w">${rel(l.t)}</span><span><b>${esc(l.name)}</b> <span class="w">${esc(l.cls)}-${esc(l.seat)}</span></span><span>${what}</span></div>`;}).join('')||'<div class="tempty">還沒有動態。</div>'}</div></div>`;
    out.innerHTML=html;
  }
}
function studentDetail(s,m){
  const mine=m.logs.filter(l=>l.cls===s.cls&&l.seat===s.seat);
  const ans=mine.filter(l=>l.ev==='作答').reverse();
  const clears=mine.filter(l=>l.ev==='逃脫成功');
  const fr=ans.length?Math.round(ans.filter(a=>a.first).length/ans.length*100):null;
  overlay((o,close)=>{
    o.innerHTML=`<div class="ovc wide"><div class="ov-k">${esc(s.cls)} 班 ${esc(s.seat)} 號</div><h2>${esc(s.name)}</h2>
     <p>${esc(s.cur)} · Lv ${s.lv} · 完成 ${s.done} 章 · ★ ${s.stars} · 委託 ${s.dn} 份 · 快算最高 ${s.rush} 分 · 最後上線 ${rel(s.last)}${fr!=null?` · 第一次答對率 ${fr}%`:''}</p>
     <div class="chs">${s.chs.map((c,k)=>`<i class="s${c}" title="第 ${RN[k]} 章" style="width:28px;height:28px;font-size:13px">${c?c+'★':RN[k]}</i>`).join('')}</div>
     ${clears.length?`<p style="font-size:13.5px">${clears.map(c=>`${esc(c.ch)}：${esc(c.note)}`).join('　')}</p>`:''}
     <div class="skgrid">${s.sk.map((k,j)=>`<div class="l${k.lv}">${SKILLS[j].name}<br>${k.txt?esc(k.txt):'未接觸'}</div>`).join('')}</div>
     <div class="ov-row" style="justify-content:space-between"><b style="font-family:var(--f-title)">作答過程（新到舊，共 ${ans.length} 題）</b><label class="ck"><input type="checkbox" id="onlyW"> 只看答錯過的</label></div>
     <div class="alist" id="alist"></div>
     <div class="ov-row"><button class="gbtn" type="button" data-primary>關閉</button></div></div>`;
    const list=o.querySelector('#alist');
    const draw=onlyW=>{const arr=(onlyW?ans.filter(a=>!a.first):ans).slice(0,300);
      list.innerHTML=arr.length?arr.map(a=>`<div class="aitem${a.first?'':' wr'}"><div class="h"><span>${a.t?a.t.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}):''}</span><span>${esc(a.mode)}${a.q?' · 鎖 '+a.q:''}${a.room?' · '+esc(a.room):''}</span><span>${esc(a.skill)}</span><span>${a.sec} 秒</span>${a.first?'<span class="tag ok">一次答對</span>':a.reveal?'<span class="tag bad">看了解答</span>':a.ok?`<span class="tag mid">試了 ${a.tries} 次</span>`:'<span class="tag bad">未答對</span>'}${a.hint?'<span class="tag mid">買了提示</span>':''}</div><div class="qq">${esc(a.question)}</div><div class="ga">作答：${esc(a.given||'—')}　→　正解：${esc(a.correct)}</div></div>`).join(''):'<div class="tempty">沒有符合的作答。</div>';};
    draw(false);
    o.querySelector('#onlyW').onchange=e=>draw(e.target.checked);
    o.querySelector('[data-primary]').onclick=()=>close();
    o.addEventListener('click',e=>{if(e.target===o)close();});
  });
}

function openSettings(){
  overlay((o,close)=>{
    o.innerHTML=`<div class="ovc"><div class="ov-k">Optiones · 設定</div><h2>設定</h2>
     <div class="stuline"><span>${S.student?`${esc(S.student.cls)} 班 ${esc(S.student.seat)} 號 <b>${esc(S.student.name)}</b>`:'還沒登記上船'}</span><button class="gbtn ghost sm" type="button" id="sSwitch">換人登入</button></div>
     <p class="syncst" id="sSync"></p>
     <div class="ov-row"><label class="ck"><input type="checkbox" id="sMute" ${S.muted?'':'checked'}> 開啟音效</label><button class="gbtn ghost sm" type="button" id="sTest">測試音效</button></div>
     <div class="ov-row"><button class="gbtn ghost sm" type="button" id="sFlush">立即上傳紀錄</button><button class="gbtn ghost sm" type="button" id="sTeach">教師入口</button></div>
     <div class="ov-row"><button class="gbtn ghost sm" type="button" id="sReset">清除這台裝置的進度</button><span id="sMsg" style="font-size:12.5px;color:var(--fg2)"></span></div>
     <p>遊戲進度存在這台裝置的瀏覽器裡，換裝置或清除瀏覽資料就會從頭開始；上傳給老師的作答紀錄不會消失。</p>
     <p class="credit">設計：余佳霖老師 · Valerie Yu Studio · Find the value of you!</p>
     <div class="ov-row"><button class="gbtn" type="button" data-primary>完成</button></div></div>`;
    let armed=false;
    o.querySelector('#sReset').onclick=()=>{
      if(!armed){armed=true;o.querySelector('#sReset').textContent='再按一次確認清除';o.querySelector('#sMsg').textContent='等級、銀幣、星星和成就都會消失。';return;}
      const st=S.student;logEv('reset',{note:'清除了這台裝置的遊戲進度'});S=fresh();S.student=st;S.name=st?st.name:'';save();D.board=null;D.streak=0;selCh=null;o.querySelector('#sMsg').textContent='已清除。';o.querySelector('#sReset').textContent='已清除';
    };
    o.querySelector('[data-primary]').onclick=()=>{
      S.muted=!o.querySelector('#sMute').checked;save();scheduleFlush();close();
    };
    const sy=o.querySelector('#sSync');sy.textContent=syncText();
    o.querySelector('#sSwitch').onclick=()=>close('switch');
    o.querySelector('#sMute').onchange=e=>{S.muted=!e.target.checked;save();if(!S.muted){unlockAudio();sfx('ok');}};
    o.querySelector('#sTest').onclick=()=>{unlockAudio();if(S.muted){S.muted=false;save();o.querySelector('#sMute').checked=true;}sfx('unlock');setTimeout(()=>sfx('ok'),250);setTimeout(()=>sfx('coin'),700);};
    o.querySelector('#sTeach').onclick=()=>close('teacher');
    o.querySelector('#sFlush').onclick=()=>{if(!logUrl()){sy.textContent=syncText();return;}if(!LQ.length){sy.textContent='沒有待上傳的紀錄。';return;}sy.textContent='上傳中……';flush();setTimeout(()=>sy.textContent=syncText(),2500);};
  }).then(a=>{if(a==='teacher'){teacherLogin();return;}if(a==='switch'){switchStudent();go('title');return;}if(screen==='hub'||screen==='title')go(screen);else updateHud();});
}

window.addEventListener('resize',()=>{const c=FX.c,dpr=window.devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){if(screen==='play'&&P&&P.enter){addActive();P.enter=0;}beaconFlush();}
  else if(screen==='play'&&P&&!P.enter&&S.run[P.ci]){P.enter=Date.now();}
});
setInterval(()=>{if(LQ.length)flush();},60000);
setTimeout(flush,2500);
go('title');
if(location.hash==='#teacher') setTimeout(teacherLogin,300);
})();
</script>
